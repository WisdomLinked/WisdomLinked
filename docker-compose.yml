version: '3.8'

services:
  # MongoDB for local/docker dev. From the API container, use host name `mongo`, not `localhost`.
  mongo:
    image: mongo:7
    container_name: wisdomlinked_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - custom_network
    restart: unless-stopped

  backend:
    build:
      context: ./BE
    container_name: wisdomlinked_backend
    ports:
      - "5000:5000"
    env_file:
      - ./BE/.env
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - custom_network

  frontend:
    build:
      context: ./FE
    container_name: wisdomlinked_frontend
    ports:
      - "3000:80"
    env_file:
      - ./FE/.env
    depends_on:
      - backend
    volumes:
      - ./FE/nginx.local.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge

volumes:
  mongo_data:
