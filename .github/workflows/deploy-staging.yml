# Deploy to Staging - v3 (Optimized)
name: Deploy to Staging

on:
  push:
    branches: [ "staging" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: wisdomlinked/wisdomlinked/chat-backend
  FRONTEND_IMAGE: wisdomlinked/wisdomlinked/chat-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Detect which directories changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'BE/**'
            frontend:
              - 'FE/**'

  build-and-push-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Frontend .env file from secrets
        run: |
          cat << EOF > ./FE/.env.production
          REACT_APP_SERVER_URL=https://staging.wisdomlinked.com
          REACT_APP_API_BASE_URL=https://staging.wisdomlinked.com/api
          REACT_APP_HOST_URL=https://staging.wisdomlinked.com
          REACT_APP_BASE_URL=/
          REACT_APP_AUTH_URL=/user/
          REACT_APP_PAYPAL_TEST_CLIENT_ID=${{ secrets.REACT_APP_PAYPAL_TEST_CLIENT_ID }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY_TEST=${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY_TEST }}
          REACT_APP_ROCKETCHAT_URL=${{ secrets.ROCKETCHAT_URL }}
          REACT_APP_JITSI_DOMAIN=${{ secrets.JITSI_DOMAIN }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_SERVER_URL=${{ secrets.REACT_APP_SERVER_URL }}
            REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}
            REACT_APP_HOST_URL=${{ secrets.REACT_APP_HOST_URL }}
            REACT_APP_BASE_URL=${{ secrets.REACT_APP_BASE_URL }}
            REACT_APP_AUTH_URL=${{ secrets.REACT_APP_AUTH_URL }}
            REACT_APP_PAYPAL_TEST_CLIENT_ID=${{ secrets.REACT_APP_PAYPAL_TEST_CLIENT_ID }}
            REACT_APP_STRIPE_PUBLISHABLE_KEY_TEST=${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY_TEST }}
            REACT_APP_ROCKETCHAT_URL=${{ secrets.ROCKETCHAT_URL }}
            REACT_APP_JITSI_DOMAIN=${{ secrets.JITSI_DOMAIN }}

  deploy:
    needs: [changes, build-and-push-backend, build-and-push-frontend]
    if: always() && (needs.build-and-push-backend.result == 'success' || needs.build-and-push-backend.result == 'skipped') && (needs.build-and-push-frontend.result == 'success' || needs.build-and-push-frontend.result == 'skipped') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the freshest images
            docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:staging
            docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:staging
            
            # Restart backend if it changed
            docker stop wisdomlinked_backend_staging || true
            docker rm wisdomlinked_backend_staging || true
            
            # Restart frontend if it changed
            docker stop wisdomlinked_frontend_staging || true
            docker rm wisdomlinked_frontend_staging || true
            
            # Create the custom docker network if it doesn't already exist
            docker network create chat_custom_network || true
            
            # Run the Backend Staging Container
            docker run -d \
              --name wisdomlinked_backend_staging \
              --restart unless-stopped \
              --network chat_custom_network \
              -p 5001:5000 \
              -e NODE_ENV="staging" \
              -e FE_URL="https://staging.wisdomlinked.com" \
              -e DO_SPACES_ENDPOINT="${{ secrets.DO_SPACES_ENDPOINT }}" \
              -e DO_SPACES_KEY="${{ secrets.DO_SPACES_KEY }}" \
              -e DO_SPACES_SECRET="${{ secrets.DO_SPACES_SECRET }}" \
              -e DO_SPACES_BUCKET="${{ secrets.DO_SPACES_BUCKET }}" \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e STRIPE_SECRET_KEY_TEST="${{ secrets.STRIPE_SECRET_KEY_TEST }}" \
              -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              -e COOKIE_EXPIRED_TIME="86400000" \
              -e SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
              -e GOOGLE_EMAIL="${{ secrets.GOOGLE_EMAIL }}" \
              -e GOOGLE_PASSWORD="${{ secrets.GOOGLE_PASSWORD }}" \
              -e ZOHONOREPLY_USER="${{ secrets.ZOHONOREPLY_USER }}" \
              -e ZOHONOREPLY_PASS="${{ secrets.ZOHONOREPLY_PASS }}" \
              -e ZOHOADMIN_USER="${{ secrets.ZOHOADMIN_USER }}" \
              -e ZOHOADMIN_PASS="${{ secrets.ZOHOADMIN_PASS }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e ROCKETCHAT_URL="${{ secrets.ROCKETCHAT_URL }}" \
              -e ROCKETCHAT_ADMIN_USER="${{ secrets.ROCKETCHAT_ADMIN_USER }}" \
              -e ROCKETCHAT_ADMIN_PASS="${{ secrets.ROCKETCHAT_ADMIN_PASS }}" \
              -e ROCKETCHAT_CREATE_TOKENS_SECRET="${{ secrets.ROCKETCHAT_CREATE_TOKENS_SECRET }}" \
              -e RC_DEBUG_TRACE="${{ secrets.RC_DEBUG_TRACE }}" \
              ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:staging

            # Run the Frontend Staging Container
            docker run -d \
              --name wisdomlinked_frontend_staging \
              --restart unless-stopped \
              --network chat_custom_network \
              -p 3001:80 \
              ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:staging
