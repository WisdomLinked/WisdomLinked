services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:6.6.6
    container_name: rocketchat_staging
    restart: unless-stopped
    environment:
      - ROOT_URL=https://chat-staging.wisdomlinked.com
      - PORT=3000
      - MONGO_URL=mongodb://mongodb:27017/rocketchat_staging?replicaSet=rs1
      - MONGO_OPLOG_URL=mongodb://mongodb:27017/local?replicaSet=rs1
      - DEPLOY_METHOD=docker
      - CREATE_TOKENS_FOR_USERS_SECRET=${CREATE_TOKENS_FOR_USERS_SECRET:?set in .env}
    ports:
      - "3002:3000"
    depends_on:
      - mongodb
    volumes:
      - rocketchat_staging_uploads:/app/uploads
    networks:
      - rc_staging_net

  mongodb:
    image: mongo:8.0
    container_name: rocketchat_staging_mongo
    restart: unless-stopped
    command: mongod --replSet rs1 --oplogSize 128
    volumes:
      - mongodb_staging_data:/data/db
    networks:
      - rc_staging_net

volumes:
  mongodb_staging_data:
  rocketchat_staging_uploads:

networks:
  rc_staging_net:
    driver: bridge
