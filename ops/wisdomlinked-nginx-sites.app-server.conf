server {
    if ($host = www.wisdomlinked.com) { return 301 https://$host$request_uri; }
    if ($host = wisdomlinked.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name wisdomlinked.com www.wisdomlinked.com;
    return 404;
}

